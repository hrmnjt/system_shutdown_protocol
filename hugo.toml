baseURL = "https://example.invalid/"
locale = "en"
title = "System Shutdown Protocol"
publishDir = "dist"

# The built site is intended to work when dist/index.html is opened directly.
relativeURLs = true
uglyURLs = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT"]

[params]
  description = "Our household continuity manual"
  protocolVersion = "0.4 draft"
  protocolStatus = "Draft — I still need to fill in important details"
  classification = "Private family document"
  lastReviewed = "Not yet reviewed"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
